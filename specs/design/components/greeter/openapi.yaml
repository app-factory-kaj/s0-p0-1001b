openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Get a greeting for a name, or a default greeting when none is given
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet; omitted or empty falls back to a default greeting
      responses:
        '200':
          description: A JSON greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: Service is healthy
components:
  schemas:
    Greeting:
      type: object
      required: [name, message]
      properties:
        name:
          type: string
          description: The name that was greeted, or the default name when none was supplied
        message:
          type: string
          description: The full greeting text
